name: rto

services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: rto-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # HOST is what services running on the laptop connect to; INTERNAL is for
      # container-to-container. Advertising only one of these is the usual cause
      # of "connected, then immediately disconnected" Kafka clients.
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: rto-local-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:18-trixie
    container_name: rto-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rto
      POSTGRES_PASSWORD: rto
      POSTGRES_DB: rto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rto -d rto"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Creates one schema per service. Flyway owns the tables inside each.
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro

  redis:
    image: redis:8-alpine
    container_name: rto-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  kafka-data:
  pg-data:
