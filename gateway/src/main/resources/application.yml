spring:
  application:
    name: gateway
  main:
    # Belt and braces: the gateway must be reactive. If a servlet starter ever arrives
    # transitively, this fails loudly at startup rather than silently booting the wrong
    # web stack and breaking every route.
    web-application-type: reactive

server:
  port: 8080

rto:
  jwt:
    secret: ${RTO_JWT_SECRET:rto-local-development-secret-key-do-not-use-in-production}
    issuer: rto
    staff-ttl: 12h
  cors:
    allowed-origins: ${RTO_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
  services:
    menu: ${RTO_MENU_SERVICE_URL:http://localhost:8081}
    order: ${RTO_ORDER_SERVICE_URL:http://localhost:8082}
    kitchen: ${RTO_KITCHEN_SERVICE_URL:http://localhost:8083}
    table: ${RTO_TABLE_SERVICE_URL:http://localhost:8084}
    payment: ${RTO_PAYMENT_SERVICE_URL:http://localhost:8085}
    notification: ${RTO_NOTIFICATION_SERVICE_URL:http://localhost:8086}
  staff:
    # Demo accounts. Passwords are BCrypt hashes, never plaintext, even here -- the seed
    # file is the first place a real deployment's credentials would leak from.
    # All four demo passwords are the username followed by "-pw" (e.g. "marco-pw").
    users:
      - username: marco
        role: KITCHEN
        passwordHash: "$2a$10$AJE3cxrUOJxTTSPo3y9e3uQ1fGV.SJgKC9DVrjKSUfVqn4r6Q.PrW"
      - username: ana
        role: STAFF
        passwordHash: "$2a$10$33vMTIxM1bbt/Sf1B.EOx.X9aiJz4/aiyWqu7mbM9DK3DFqN6ohBu"
      - username: sam
        role: STAFF
        passwordHash: "$2a$10$98c.qwfbNoS6.sQi8ZDW5.FZO/oSBWizXXVppa.JDpQFupNhKkMPO"
      - username: rita
        role: MANAGER
        passwordHash: "$2a$10$LwhxN38qhV1xgv76mGMTTe9b/XIDGqyEBVTVpJM34jDY3MAgl7duu"

logging:
  level:
    com.restaurant.ordering: DEBUG
