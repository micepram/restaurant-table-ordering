spring:
  application:
    name: order-service
  config:
    import: classpath:rto-kafka-defaults.yml

  datasource:
    url: ${RTO_POSTGRES_URL:jdbc:postgresql://localhost:5433/rto}
    username: ${RTO_POSTGRES_USER:rto}
    password: ${RTO_POSTGRES_PASSWORD:rto}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
    open-in-view: false

  flyway:
    enabled: true
    schemas: orders
    default-schema: orders

  kafka:
    bootstrap-servers: ${RTO_KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      # Stable group id: order-service owns the order aggregate, so exactly one instance
      # must apply each kitchen intent or payment. Broadcasting would apply it twice.
      group-id: order-service

server:
  # Surfaces the exception message in error responses. Validation failures here are
  # meant for the customer's screen ("Ribeye Steak requires at least 1 choice from
  # Cooked to"), and the default response body omits the message entirely.
  error:
    include-message: always
  port: 8082

rto:
  jwt:
    secret: ${RTO_JWT_SECRET:rto-local-development-secret-key-do-not-use-in-production}
    issuer: rto
  menu-service:
    base-url: ${RTO_MENU_SERVICE_URL:http://localhost:8081}

logging:
  level:
    com.restaurant.ordering: DEBUG
